version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coopetraes_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:coopetraes_secure_pass_2026@db:5432/coopetraes?schema=public"
      REDIS_URL: "redis://redis:6379"
      CACHE_PROVIDER: "REDIS"
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_SECRET: "coopetraes_auth_secure_secret_production_2026_x89q"
      AUTH_SECRET: "coopetraes_auth_secure_secret_production_2026_x89q"
      NEXTAUTH_URL: "https://app.coopetraes.com"
      NEXT_PUBLIC_APP_URL: "https://app.coopetraes.com"
      UPLOAD_DIR: "/app/uploads"
      STORAGE_PATH: "/app/storage"
      SEED_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - storage_data:/app/storage
    networks:
      - coopetraes_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: coopetraes_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: coopetraes_secure_pass_2026
      POSTGRES_DB: coopetraes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coopetraes_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coopetraes"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coopetraes_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - coopetraes_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  storage_data:

networks:
  coopetraes_net:
    driver: bridge
