name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

env:
    NODE_VERSION: "20.x"

jobs:
    # Job 1: Code Quality Checks
    quality:
        name: Code Quality
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Run TypeScript Check
              run: npx tsc --noEmit

            - name: Check code formatting
              run: npx prettier --check .

    # Job 2: Security Audit
    security:
        name: Security Audit
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run npm audit
              run: npm audit --audit-level=high
              continue-on-error: true

    # Job 3: Tests
    test:
        name: Run Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test
              env:
                  DATABASE_URL: postgresql://test:test@localhost:5432/test_db

    # Job 4: Build
    build:
        name: Build Application
        runs-on: ubuntu-latest
        needs: [quality, test]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build application
              run: npm run build
              env:
                  DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
                  AUTH_SECRET: dummy-secret-for-build
                  AUTH_TRUST_HOST: true

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: build-artifacts
                  path: .next
                  retention-days: 7

    # Job 5: Deploy to Staging (only on main branch)
    deploy-staging:
        name: Deploy to Staging
        runs-on: ubuntu-latest
        needs: [build]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        environment:
            name: staging
            url: https://staging.coopetraes.com

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: build-artifacts
                  path: .next

            - name: Deploy to staging
              run: |
                  echo "🚀 Deploying to staging environment..."
                  echo "This step would typically:"
                  echo "  - Upload files to staging server"
                  echo "  - Run database migrations"
                  echo "  - Restart application services"
                  echo "  - Verify deployment health"
              # Add your actual deployment commands here
              # Example: rsync, scp, docker push, etc.

    # Job 6: Notify
    notify:
        name: Notify Results
        runs-on: ubuntu-latest
        needs: [quality, security, test, build]
        if: always()

        steps:
            - name: Check job results
              run: |
                  echo "Quality: ${{ needs.quality.result }}"
                  echo "Security: ${{ needs.security.result }}"
                  echo "Tests: ${{ needs.test.result }}"
                  echo "Build: ${{ needs.build.result }}"
